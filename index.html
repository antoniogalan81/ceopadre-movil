<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- La misma página sirve en el PC (API local) y en el móvil (Supabase). Scripts sólo propios:
     el cliente de Supabase viaja en vendor/, no desde una CDN (lección de Batuta). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://pzlotrzphjpnqixrtvin.supabase.co wss://pzlotrzphjpnqixrtvin.supabase.co; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono.svg">
<link rel="stylesheet" href="style.css">
<title>CEOPadre</title>
</head>
<body>

<section id="p-login" class="screen" hidden>
  <div class="login">
    <h1 class="brand">CEO<span>Padre</span></h1>
    <p class="muted">Entra una vez con la cuenta de CEOPadre. El teléfono recuerda la sesión.</p>
    <label class="field">Correo<input id="l-email" type="email" autocomplete="username" spellcheck="false" value="antonio@ceopadre.local"></label>
    <label class="field">Contraseña<input id="l-pass" type="password" autocomplete="current-password"></label>
    <button class="btn primary big" id="l-go">Entrar</button>
    <p class="error" id="l-err" hidden></p>
  </div>
</section>

<section id="p-list" class="screen" hidden>
  <header class="top">
    <h1 class="brand">CEO<span>Padre</span></h1>
    <button class="btn ghost" id="b-new-project">+ Proyecto</button>
  </header>
  <p class="pcline" id="pc-line" hidden></p>
  <h2 class="section-title">Mis proyectos</h2>
  <main id="cards" class="cards" aria-live="polite"></main>
  <p class="empty" id="empty" hidden>Todavía no hay proyectos. Pulsa <b>+ Proyecto</b>.</p>
</section>

<section id="p-detail" class="screen" hidden>
  <header class="top">
    <button class="btn ghost" id="d-back" aria-label="Volver">‹ Volver</button>
    <h1 class="detail-name" id="d-name"></h1>
  </header>
  <main id="d-body" class="detail"></main>
</section>

<dialog id="dlg" class="sheet">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title"></h2>
    <p class="muted" id="dlg-help"></p>
    <div id="dlg-fields"></div>
    <div class="row">
      <button class="btn ghost" value="cancel" formnovalidate>Volver</button>
      <button class="btn primary" id="dlg-ok" value="ok">Aceptar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
